<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offline FX Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a73e8">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary: #1a73e8;
      --bg: #f8f9fa;
      --text: #202124;
      --border: #dadce0;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 640px;
      margin: 24px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(60,64,67,0.2);
      padding: 16px;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .row label {
      font-size: 0.85rem;
      color: #5f6368;
      min-width: 60px;
    }
    input[type="number"] {
      flex: 1;
      padding: 8px;
      font-size: 1rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    select {
      min-width: 90px;
      padding: 8px;
      font-size: 0.95rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #fff;
    }
    button {
      padding: 8px 16px;
      border-radius: 4px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button[disabled] {
      opacity: 0.6;
      cursor: default;
    }
    .result {
      font-size: 1.3rem;
      font-weight: 500;
      margin-top: 8px;
    }
    .meta {
      font-size: 0.8rem;
      color: #5f6368;
      margin-top: 6px;
    }
    .meta span.status-online {
      color: #188038;
      font-weight: 600;
    }
    .meta span.status-offline {
      color: #d93025;
      font-weight: 600;
    }
    .rate-info {
      font-size: 0.9rem;
      margin-top: 4px;
      color: #5f6368;
    }
    .small-link {
      font-size: 0.8rem;
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Currency Converter (Offline‑friendly)</h1>

    <div class="card">
      <div class="row">
        <label for="amount">Amount</label>
        <input id="amount" type="number" step="0.01" value="1">
      </div>

      <div class="row">
        <label for="from-currency">From</label>
        <select id="from-currency"></select>
      </div>

      <div class="row">
        <label for="to-currency">To</label>
        <select id="to-currency"></select>
      </div>

      <div class="row">
        <button id="convert-button">Convert</button>
        <button id="swap-button" type="button">Swap</button>
      </div>

      <div class="result" id="result-display"></div>
      <div class="rate-info" id="rate-info"></div>
      <div class="meta">
        <span id="status-indicator"></span>
        <br>
        Last updated: <span id="last-updated">–</span>
      </div>
      <button class="small-link" id="refresh-rates" type="button">
        Refresh rates now
      </button>
    </div>

    <div class="card">
      <p class="meta">
        This converter caches exchange rates on your device. When you are offline,
        it uses the most recent saved rates until you go online again.
      </p>
    </div>
  </div>

  <script>
    // --- CONFIG: set this to your backend/FX endpoint ---
    const FX_API_URL = 'https://example.com/api/fx/latest?base=USD';
    // Expecting JSON: { base: 'USD', date: 'YYYY-MM-DD', timestamp: number, rates: { 'EUR': 0.9, ... } }

    const STORAGE_KEY_RATES = 'fx-rates-v1';   // stored JSON: { base, date, timestamp, rates }
    const STORAGE_KEY_LAST_BASE = 'fx-last-base';
    const STORAGE_KEY_LAST_TO = 'fx-last-to';

    const amountInput = document.getElementById('amount');
    const fromSelect = document.getElementById('from-currency');
    const toSelect = document.getElementById('to-currency');
    const convertButton = document.getElementById('convert-button');
    const swapButton = document.getElementById('swap-button');
    const resultDisplay = document.getElementById('result-display');
    const rateInfo = document.getElementById('rate-info');
    const statusIndicator = document.getElementById('status-indicator');
    const lastUpdatedEl = document.getElementById('last-updated');
    const refreshButton = document.getElementById('refresh-rates');

    let cachedRates = null; // { base, date, timestamp, rates }

    // --- Utility functions ---

    function isOnline() {
      return navigator.onLine;
    }

    function loadCachedRates() {
      const raw = localStorage.getItem(STORAGE_KEY_RATES);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch (e) {
        console.error('Failed to parse cached rates', e);
        return null;
      }
    }

    function saveCachedRates(data) {
      localStorage.setItem(STORAGE_KEY_RATES, JSON.stringify(data));
    }

    function setStatus() {
      if (isOnline()) {
        statusIndicator.textContent = 'Online (live rates available)';
        statusIndicator.className = 'status-online';
      } else {
        statusIndicator.textContent = 'Offline (using saved rates if available)';
        statusIndicator.className = 'status-offline';
      }
    }

    function formatTimestamp(ts, dateStr) {
      if (ts) {
        const d = new Date(ts * 1000);
        return d.toLocaleString();
      }
      if (dateStr) return dateStr;
      return '–';
    }

    function updateLastUpdated() {
      if (!cachedRates) {
        lastUpdatedEl.textContent = 'No data yet';
      } else {
        lastUpdatedEl.textContent = formatTimestamp(cachedRates.timestamp, cachedRates.date);
      }
    }

    function populateCurrencyOptions() {
      const currencies = cachedRates ? Object.keys(cachedRates.rates) : [];
      if (!currencies.length) return;

      const prevFrom = localStorage.getItem(STORAGE_KEY_LAST_BASE) || 'USD';
      const prevTo = localStorage.getItem(STORAGE_KEY_LAST_TO) || 'EUR';

      fromSelect.innerHTML = '';
      toSelect.innerHTML = '';

      currencies.sort().forEach(code => {
        const opt1 = document.createElement('option');
        opt1.value = code;
        opt1.textContent = code;
        if (code === prevFrom) opt1.selected = true;
        fromSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = code;
        opt2.textContent = code;
        if (code === prevTo) opt2.selected = true;
        toSelect.appendChild(opt2);
      });
    }

    function convertAmount() {
      if (!cachedRates || !cachedRates.rates) {
        resultDisplay.textContent = 'No rate data yet. Go online and refresh.';
        rateInfo.textContent = '';
        return;
      }
      const amount = parseFloat(amountInput.value);
      const from = fromSelect.value;
      const to = toSelect.value;

      if (isNaN(amount)) {
        resultDisplay.textContent = '';
        rateInfo.textContent = '';
        return;
      }
      if (!from || !to) {
        resultDisplay.textContent = 'Select currencies.';
        rateInfo.textContent = '';
        return;
      }

      localStorage.setItem(STORAGE_KEY_LAST_BASE, from);
      localStorage.setItem(STORAGE_KEY_LAST_TO, to);

      const base = cachedRates.base;
      const rates = cachedRates.rates;

      if (!rates[from] || !rates[to]) {
        resultDisplay.textContent = 'Rate not available for selected pair.';
        rateInfo.textContent = '';
        return;
      }

      // Convert via base:
      // amount (from) -> base -> to
      // valueInBase = amount / rate[from]; result = valueInBase * rate[to]
      const valueInBase = amount / rates[from];
      const result = valueInBase * rates[to];

      resultDisplay.textContent = `${amount.toFixed(2)} ${from} = ${result.toFixed(4)} ${to}`;
      const pairRate = (rates[to] / rates[from]);
      rateInfo.textContent = `1 ${from} = ${pairRate.toFixed(6)} ${to}`;
    }

    async function fetchLatestRates(showToast = true) {
      if (!isOnline()) {
        if (showToast) {
          alert('You are offline. Using saved rates if available.');
        }
        return;
      }

      convertButton.disabled = true;
      refreshButton.disabled = true;
      refreshButton.textContent = 'Refreshing…';

      try {
        const response = await fetch(FX_API_URL, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        const data = await response.json();
        // Basic shape validation
        if (!data || !data.rates || typeof data.rates !== 'object') {
          throw new Error('Unexpected rate format');
        }

        cachedRates = {
          base: data.base || 'USD',
          date: data.date || null,
          timestamp: data.timestamp || Math.floor(Date.now() / 1000),
          rates: data.rates
        };

        saveCachedRates(cachedRates);
        populateCurrencyOptions();
        updateLastUpdated();
        convertAmount();
        if (showToast) {
          alert('Rates updated.');
        }
      } catch (err) {
        console.error(err);
        if (showToast) {
          alert('Failed to fetch latest rates. Using saved data if available.');
        }
      } finally {
        convertButton.disabled = false;
        refreshButton.disabled = false;
        refreshButton.textContent = 'Refresh rates now';
      }
    }

    function init() {
      setStatus();
      cachedRates = loadCachedRates();
      if (cachedRates && cachedRates.rates) {
        populateCurrencyOptions();
      }
      updateLastUpdated();

      // Try to get fresh rates on first load if online
      if (isOnline()) {
        fetchLatestRates(false);
      }

      convertAmount();
    }

    // --- Event listeners ---
    window.addEventListener('online', () => {
      setStatus();
      // Optionally auto-refresh on reconnect:
      fetchLatestRates(false);
    });
    window.addEventListener('offline', setStatus);

    amountInput.addEventListener('input', convertAmount);
    fromSelect.addEventListener('change', convertAmount);
    toSelect.addEventListener('change', convertAmount);
    convertButton.addEventListener('click', (e) => {
      e.preventDefault();
      convertAmount();
    });
    swapButton.addEventListener('click', () => {
      const from = fromSelect.value;
      const to = toSelect.value;
      if (!from || !to) return;
      fromSelect.value = to;
      toSelect.value = from;
      convertAmount();
    });
    refreshButton.addEventListener('click', () => fetchLatestRates(true));

    // --- Service worker registration (same pattern as your first app) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.error('SW registration failed', err);
        });
      });
    }

    // Init
    init();
  </script>
</body>
</html>
